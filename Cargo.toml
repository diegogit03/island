[package]
name = "island"
version = "0.8.0"
edition = "2024"

[dependencies]
bincode = "1.3"
macroquad = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Dependências otimizadas mesmo em debug: o jogo roda fluido sem precisar de --release.
[profile.dev.package."*"]
opt-level = 3
